name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-build:
    name: Lint and Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Ou la version que vous utilisez
          cache: 'npm' # Met en cache les dépendances npm

      - name: Install dependencies
        run: npm ci # 'ci' est généralement plus rapide et plus fiable pour la CI que 'install'

      - name: Run linter
        run: npm run lint # Exécute le script de lint défini dans package.json

      - name: Build application
        run: npm run build # Exécute le script de build défini dans package.json

      # Optionnel: Upload l'artefact de build (les fichiers statiques)
      # - name: Upload build artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: frontend-dist
      #     path: dist/ # Le dossier de sortie de Vite est généralement 'dist'